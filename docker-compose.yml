services:
  global-db:
    # Cambiamos a la imagen oficial de pgvector basada en Postgres 17
    image: pgvector/pgvector:pg17
    container_name: global-db
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - global_db_data:/var/lib/postgresql/data
    networks:
      - harco_network
    healthcheck:
      # El healthcheck sigue siendo el mismo, funciona igual
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  harco_network:
    name: harco_network
    external: true

volumes:
  global_db_data: